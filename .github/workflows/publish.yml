name: Publish npm package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.repository == 'IDuxFE/geo-areas' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: packages/geo-areas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Check tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (`v${p.version}` !== process.env.GITHUB_REF_NAME) throw new Error("Tag/version mismatch")'
      - run: pnpm check
      - name: Pack with the actual repository URL for provenance
        run: node scripts/pack-for-ci.mjs
      - run: pnpm publish release.tgz --ignore-scripts --access public --provenance
