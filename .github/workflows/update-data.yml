name: Update public-source datasets
on:
  schedule:
    # Monday 01:00 Asia/Shanghai (Sunday 17:00 UTC).
    - cron: '0 17 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-public-data
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'IDuxFE/geo-areas'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh upstream maintained package data
        run: pnpm --filter @idux/geo-areas update --latest @vant/area-data i18n-iso-countries libphonenumber-js pinyin-pro cldr-core cldr-localenames-full
      - run: pnpm update:data
      - run: pnpm audit:data
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm site:build
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: main
          branch: chore/update-public-data
          commit-message: 'chore: refresh public geographic datasets'
          title: 'chore: refresh public geographic datasets'
          body: |
            Regenerated from upstream public sources without manual data editing.

            Review data-manifest.json for source hashes, upstream versions and coverage gaps.
            Review the regenerated audit/data-audit.json, audit/README.md and CHINA_MAP_COVERAGE.md for conversion checks and coverage changes.

            Validation: pnpm update:data; pnpm audit:data; pnpm lint; pnpm format:check; pnpm check; pnpm site:build.

            Maintainer review and rebase merge are required. This PR updates data only; it does not generate Changesets, bump versions, create release tags or publish a package. Release notes and versioning are prepared separately when a maintainer decides to release.
          add-paths: |
            packages/geo-areas/src/generated
            packages/geo-areas/src/data
            packages/geo-areas/data-manifest.json
            packages/geo-areas/CHINA_MAP_COVERAGE.md
            packages/geo-areas/package.json
            pnpm-lock.yaml
            packages/geo-areas/licenses
            packages/geo-areas/audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-data-update-report
          path: packages/geo-areas/.cache/update-report.json
          if-no-files-found: warn
          retention-days: 30
