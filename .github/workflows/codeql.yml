name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 3'
permissions:
  contents: read
jobs:
  analyze:
    if: github.repository == 'IDuxFE/geo-areas'
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - packages/geo-areas/src/data
              - packages/geo-areas/src/generated
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
