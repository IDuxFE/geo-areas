name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: node --test .github/scripts/*.test.mjs
      - run: pnpm docs:sync
      - run: pnpm check
      - name: Require generated package documentation to be committed
        run: git diff --exit-code -- packages/geo-areas/README.md packages/geo-areas/README.zh.md packages/geo-areas/API.md packages/geo-areas/API.zh.md
      - name: Validate Changesets and package graph
        run: node .github/scripts/validate-changesets.mjs
      - run: pnpm site:build
      - name: Pack the release artifact (no publish)
        run: node packages/geo-areas/scripts/pack-for-ci.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 22
        with:
          name: package-preview
          path: packages/geo-areas/release.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: matrix.node == 22
        with:
          path: packages/site/dist
  coverage:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: packages/geo-areas/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage to Codecov
        if: github.repository == 'IDuxFE/geo-areas'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/geo-areas/coverage/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  required:
    name: CI required
    if: always()
    needs: [check, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          CHECK: ${{ needs.check.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: test "$CHECK" = success && test "$COVERAGE" = success
