name: Bug report
description: Report a reproducible code or data issue.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the package version or commit, code/map ID, minimal example and source URL for data issues.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js, package manager, browser and bundler versions where relevant.
